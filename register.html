<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียน - Research+ by Waris.R</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.5s ease-out forwards; }
    .fade-up-delay { animation: fadeUp 0.5s ease-out 0.1s forwards; opacity: 0; }
    .fade-up-delay2 { animation: fadeUp 0.5s ease-out 0.2s forwards; opacity: 0; }
    .pw-strength-bar { transition: width 0.3s ease, background-color 0.3s ease; }
    @keyframes spin-loader { to { transform: rotate(360deg); } }
    .loading-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin-loader 0.6s linear infinite; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4 py-8 antialiased">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6 fade-up">
      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="font-bold text-xl text-slate-800">Research+ by Waris.R</h1>
      <p class="text-xs text-slate-400 mt-0.5">Academic Discovery Engine</p>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 fade-up-delay">
      <h2 class="font-bold text-lg text-slate-800 mb-1">สร้างบัญชีใหม่</h2>
      <p class="text-xs text-slate-400 mb-5">ลงทะเบียนเพื่อเข้าถึงงานวิจัยนับล้าน</p>

      <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 flex items-start gap-2">
        <i class="fa-solid fa-circle-exclamation mt-0.5 text-red-500"></i>
        <span id="error-msg"></span>
      </div>
      <div id="success-box" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-700 flex items-start gap-2">
        <i class="fa-solid fa-circle-check mt-0.5 text-emerald-500"></i>
        <span id="success-msg"></span>
      </div>

      <form id="register-form" class="space-y-3.5">
        <div>
          <label class="text-xs font-semibold text-slate-700 mb-1 block">ชื่อที่แสดง</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="displayname" required placeholder="ชื่อของคุณ" minlength="2"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 text-sm text-slate-800 placeholder-slate-400 rounded-xl border border-slate-200 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition-all outline-none">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 mb-1 block">อีเมล</label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="email" id="email" required placeholder="you@example.com"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 text-sm text-slate-800 placeholder-slate-400 rounded-xl border border-slate-200 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition-all outline-none">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 mb-1 block">รหัสผ่าน</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="password" id="password" required placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6"
              class="w-full pl-10 pr-10 py-2.5 bg-slate-50 text-sm text-slate-800 placeholder-slate-400 rounded-xl border border-slate-200 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition-all outline-none">
            <button type="button" id="pw-toggle-btn" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm">
              <i id="pw-toggle-icon" class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="mt-1.5 flex items-center gap-2">
            <div class="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
              <div id="pw-strength-bar" class="pw-strength-bar h-full rounded-full" style="width: 0%"></div>
            </div>
            <span id="pw-strength-text" class="text-[10px] font-medium text-slate-400"></span>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 mb-1 block">ยืนยันรหัสผ่าน</label>
          <div class="relative">
            <i class="fa-solid fa-shield-halved absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="password" id="confirm-password" required placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="6"
              class="w-full pl-10 pr-10 py-2.5 bg-slate-50 text-sm text-slate-800 placeholder-slate-400 rounded-xl border border-slate-200 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition-all outline-none">
            <button type="button" id="pw2-toggle-btn" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm">
              <i id="pw2-toggle-icon" class="fa-regular fa-eye"></i>
            </button>
          </div>
          <p id="pw-match-msg" class="text-[10px] font-medium mt-1 hidden"></p>
        </div>
        <button type="submit" id="submit-btn"
          class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-200 transition-all flex items-center justify-center gap-2">
          <span id="btn-text">สร้างบัญชี</span>
          <div id="btn-spinner" class="hidden loading-spinner"></div>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-5 fade-up-delay2">
      มีบัญชีอยู่แล้ว?
      <a href="login.html" class="font-semibold text-indigo-600 hover:text-indigo-700">เข้าสู่ระบบ</a>
    </p>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2.5 rounded-full text-xs font-medium shadow-lg flex items-center gap-2 transform translate-y-20 opacity-0 transition-all pointer-events-none">
    <i id="toast-icon" class="fa-solid fa-check-circle text-emerald-400"></i>
    <span id="toast-msg"></span>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBj5TfsLpesX6ytSdVN-k3O0oLbUjpxwLk",
      authDomain: "testweb2026-ff231.firebaseapp.com",
      databaseURL: "https://testweb2026-ff231-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "testweb2026-ff231",
      storageBucket: "testweb2026-ff231.firebasestorage.app",
      messagingSenderId: "582408484944",
      appId: "1:582408484944:web:85490a301cde2d21e57955"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function emailToKey(email) {
      return email.replace(/\./g, '(dot)').replace(/@/g, '(at)');
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const displayName = document.getElementById('displayname').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorBox = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');

      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      if (password !== confirmPassword) {
        errorBox.classList.remove('hidden');
        document.getElementById('error-msg').textContent = 'รหัสผ่านไม่ตรงกัน กรุณากรอกใหม่';
        return;
      }
      if (password.length < 6) {
        errorBox.classList.remove('hidden');
        document.getElementById('error-msg').textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
        return;
      }

      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      btn.disabled = true;
      btnText.textContent = 'กำลังสร้างบัญชี...';
      btnSpinner.classList.remove('hidden');

      try {
        const userKey = emailToKey(email);
        const snapshot = await db.ref('users/' + userKey).once('value');

        if (snapshot.exists()) {
          errorBox.classList.remove('hidden');
          document.getElementById('error-msg').textContent = 'อีเมลนี้ถูกใช้งานแล้ว กรุณาใช้อีเมลอื่น';
          btn.disabled = false;
          btnText.textContent = 'สร้างบัญชี';
          btnSpinner.classList.add('hidden');
          return;
        }

        const passwordHash = await hashPassword(password);

        await db.ref('users/' + userKey).set({
          displayName: displayName,
          email: email,
          passwordHash: passwordHash,
          createdAt: new Date().toISOString(),
          lastLogin: new Date().toISOString()
        });

        localStorage.setItem('scholar_current_user', JSON.stringify({
          email: email,
          displayName: displayName
        }));

        successBox.classList.remove('hidden');
        document.getElementById('success-msg').textContent = 'สร้างบัญชีสำเร็จ! กำลังเข้าสู่ระบบ...';
        showToast('ลงทะเบียนสำเร็จ!', 'success');
        setTimeout(() => { window.location.href = 'research.html'; }, 1500);
      } catch (err) {
        errorBox.classList.remove('hidden');
        document.getElementById('error-msg').textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }

      btn.disabled = false;
      btnText.textContent = 'สร้างบัญชี';
      btnSpinner.classList.add('hidden');
    });

    document.getElementById('pw-toggle-btn').addEventListener('click', function() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pw-toggle-icon');
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    });

    document.getElementById('pw2-toggle-btn').addEventListener('click', function() {
      const input = document.getElementById('confirm-password');
      const icon = document.getElementById('pw2-toggle-icon');
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    });

    document.getElementById('password').addEventListener('input', function() {
      const pw = this.value;
      const bar = document.getElementById('pw-strength-bar');
      const text = document.getElementById('pw-strength-text');
      let score = 0;
      if (pw.length >= 6) score++;
      if (pw.length >= 10) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      const levels = [
        { width: '0%', color: '#e2e8f0', label: '' },
        { width: '20%', color: '#ef4444', label: 'อ่อนมาก' },
        { width: '40%', color: '#f97316', label: 'อ่อน' },
        { width: '60%', color: '#eab308', label: 'ปานกลาง' },
        { width: '80%', color: '#22c55e', label: 'ดี' },
        { width: '100%', color: '#10b981', label: 'แข็งแรงมาก' }
      ];
      const level = levels[score] || levels[0];
      bar.style.width = level.width;
      bar.style.backgroundColor = level.color;
      text.textContent = level.label;
      text.style.color = level.color;
    });

    document.getElementById('confirm-password').addEventListener('input', function() {
      const pw = document.getElementById('password').value;
      const confirm = this.value;
      const matchMsg = document.getElementById('pw-match-msg');
      if (confirm) {
        matchMsg.textContent = pw === confirm ? 'รหัสผ่านตรงกัน' : 'รหัสผ่านไม่ตรงกัน';
        matchMsg.className = 'text-[10px] font-medium mt-1 ' + (pw === confirm ? 'text-emerald-600' : 'text-red-500');
        matchMsg.classList.remove('hidden');
      } else {
        matchMsg.classList.add('hidden');
      }
    });

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      toastMsg.textContent = msg;
      toastIcon.className = type === 'error' ? 'fa-solid fa-circle-exclamation text-red-400' : 'fa-solid fa-check-circle text-emerald-400';
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); toast.classList.remove('translate-y-0', 'opacity-100'); }, 3000);
    }
  </script>
</body>
</html>
